# Локальное развертывание приложения
# Запуск:    docker compose up -d
# Статус:    docker compose ps
# Логи:      docker compose logs -f app
# Остановка: docker compose down
#
# Параметры можно переопределить через переменные окружения:
#   APP_PORT=8000 GUNICORN_WORKERS=2 docker compose up -d
#
# Тесты (сервис не стартует при обычном up, запускается отдельно):
#   docker compose run --rm tests
#   PYTEST_ARGS="-q -k index" docker compose run --rm tests

services:
  app:
    build:
      context: .
      dockerfile: app.Docker
    image: simple-app:latest
    container_name: simple-app
    ports:
      - "${APP_PORT:-5000}:${APP_PORT:-5000}"
    environment:
      FLASK_ENV: production
      APP_PORT: ${APP_PORT:-5000}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-1}
    healthcheck:
      # curl в slim-образе нет, проверяем через python
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen(f\"http://localhost:{os.environ['APP_PORT']}/health\")"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
    volumes:
      - ./logs:/logs
      - ./app:/app

  tests:
    build:
      context: .
      dockerfile: test.Docker
    image: simple-app-test:latest
    # profiles исключает сервис из обычного `docker-compose up`
    profiles: ["tests"]
    environment:
      PYTEST_ARGS: ${PYTEST_ARGS:--v}
    volumes:
      - ./app:/app